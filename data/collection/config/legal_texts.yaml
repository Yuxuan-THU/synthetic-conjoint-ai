# =============================================================================
# 法规文本登记（treatment 材料）
# =============================================================================
# data/raw/legal_texts/ 里只保留最终纯文本 {law_text_id}.txt（随仓库提交）；
# 来源、标题、年份等文档信息登记在本文件，不再生成 manifest / 质检报告，
# 也没有人工校订通道。
#
# 取文方式（retrieval.mode）：
#   fetch : 从官方页面抓取 HTML 并转纯文本（中国法规）
#   pdf   : 从本地 PDF 抽取文本层（美国 NIST AI RMF）
#
# 背景：随项目提供的 china/ 三份 PDF 均为无文本层扫描件，唯一的 OCR 版本
# 错字极多（"生成式人工智能玻务管理暂行办法"），不可用于 treatment；因此
# 中国法规改为从网信办官方页面抓取。
#
# 02_build_legal_texts.py 按本文件重建 txt：已存在则跳过，--force 才重抓，
# 并在写入前校验 quality.must_contain 锚点。文本改动会改变采集数据中的
# law_text_sha256（运行器在每次调用时对 txt 现算并写入响应行）。
# =============================================================================

paths:
  # 原始法规目录（相对项目根目录）；对应桌面上的 "ai legal text"
  source_root: "../ai legal text"
  # 输出目录（相对项目根目录）
  output_dir: "data/raw/legal_texts"

processing:
  # 是否压缩连续空行（不影响正文内容）
  collapse_blank_lines: true
  # 单次 prompt 的字符上限；null 表示不截断。
  # 截断会改变 treatment 强度，必须记录并说明节选规则。
  max_chars: null

laws:

  # --- 中国 ------------------------------------------------------------------
  - id: CN_generative_ai_interim_measures_2023
    enabled: true
    jurisdiction: CN
    title_en: "Interim Measures for the Administration of Generative AI Services"
    title_zh: "生成式人工智能服务管理暂行办法"
    issued: "2023-07-13"
    effective: "2023-08-15"
    issuer_en: "Cyberspace Administration of China and six other authorities"
    retrieval:
      mode: fetch
      url: "https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm"
      fallback_urls:
        - "https://www.gov.cn/zhengce/zhengceku/202307/content_6891752.htm"
      expected_language: zh
    quality:
      # 质检锚点；缺失即拒绝写入（防止把错误页面或乱码写进 treatment）
      must_contain: ["生成式人工智能服务管理暂行办法", "第一条", "第二十四条"]
    # 官方页面抓取后会带大量导航/页脚，用显式标记剪除
    extract:
      start_marker: "国家互联网信息办公室"
      start_occurrence: 1
      end_marker: "第二十四条 本办法自2023年8月15日起施行。"
      end_occurrence: 1
    notes: >
      本轮 CN 的 treatment 文本（3668 字符 ≈2325 token）。目录内 PDF 为扫描件、
      OCR 版本错字过多，故从网信办官方页面抓取；2026-09-18 经 Huhe 确认。

  # --- 美国 ------------------------------------------------------------------
  - id: US_nist_ai_rmf_2023
    enabled: true
    jurisdiction: US
    title_en: "Artificial Intelligence Risk Management Framework (AI RMF 1.0)"
    title_zh: "人工智能风险管理框架（AI RMF 1.0）"
    issued: "2023-01-26"
    issuer_en: "National Institute of Standards and Technology (NIST)"
    retrieval:
      mode: pdf
      path: "us/US NIST AI RMF 1.0.pdf"
      expected_language: en
    quality:
      must_contain: ["AI RMF", "GOVERN", "MANAGE"]
    # 删除逐页重复的页眉/页脚，只去排版残留，不动正文
    strip_line_patterns:
      - "^NIST AI 100-1$"
      - "^This publication is available free of charge from:.*$"
      - "^https://doi\\.org/10\\.6028/NIST\\.AI\\.100-1$"
    notes: >
      本轮 US 的 treatment 文本（105623 字符 ≈26406 token）。注意：这是自愿性
      框架（voluntary framework），不是法律。体量约为 CN 文本的 10 倍，法域
      篇幅差异须在论文中说明；2026-09-18 经 Huhe 确认（全文口径、不节选）。
