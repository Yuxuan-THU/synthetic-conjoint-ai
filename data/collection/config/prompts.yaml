# =============================================================================
# 提示词与渲染模板（Prompts & rendering templates）
# =============================================================================
# 规则（见 docs/02_prompt-freeze.md）：
#   1. 已经跑过数据的提示词版本永不原地修改；任何改动新建版本号。
#   2. 每次调用都会把 system_prompt / prefix 全文写进
#      data/raw/responses/_prompt_archive.jsonl，并记录 sha256。
#   3. status 取值：draft | huhe_review | frozen | deprecated。
#      采集脚本默认只接受 frozen（由 experiment.yaml 的 guards 控制）。
#
# 结构说明：每个版本由两块拼成
#   system_prompt = condition_block + "\n\n" + shared_block
# 两个条件共用同一段 shared_block，唯一的差异是 condition_block，
# 这样 treatment 才是干净的单一差异（同时满足"两版字数对齐"的要求）。
# =============================================================================

render:
  style_id: md_table_v1
  # --- 法规材料的注入块（仅 government 条件）--------------------------------
  legal_block_header: >-
    The following regulations and official guidance are attached.
    They establish the institutional and regulatory framework that governs your
    recommendation.
  legal_block_open: "<<<ATTACHED_MATERIALS"
  legal_block_close: "ATTACHED_MATERIALS>>>"
  # --- 任务屏 ---------------------------------------------------------------
  task_intro: >-
    Please review the two options below. Each option is a different version of the
    same system, described by the following performance characteristics.
  table_header: ["Performance characteristic", "Option A", "Option B"]
  question: "Which option do you choose?"
  option_labels:
    a: "Option A"
    b: "Option B"
  # --- 答案协议 -------------------------------------------------------------
  # 由 experiment.yaml 的 answer_protocol 选择其一；不同协议会产生不同的
  # prefix 文本，因此 prompt_archive_id 也随之不同（哈希基于实际文本）。
  answer_instructions:
    free_text: >-
      Respond with your choice (Option A or Option B) followed by a short explanation.
    choice_line: >-
      Respond with a short explanation, then end your response with a single line in
      the format: CHOICE: A or CHOICE: B
    json: >-
      Return your answer as a JSON object with exactly two keys: "choice" (either "A"
      or "B") and "explanation" (a short explanation, 50 words or fewer, in English).

# =============================================================================
# 提示词版本
# =============================================================================

prompts:

  # --- generic（对照组：无外力干涉）-----------------------------------------
  generic_v1:
    status: frozen
    version: 1
    condition: generic
    language: en
    created: "2026-09-18"
    frozen_at: "2026-09-18"
    confirmed_by: null            # 待登记：实际确认人
    basis: "基于 Huhe 2026-09-17 草稿改写；补强至与 government 版同等篇幅，并修掉原稿语法遗漏"
    condition_block: |
      You are an AI decision-support system advising on a public decision. Base your
      recommendation only on the substantive information provided in the decision
      scenario. Use your own general knowledge and reasoning to interpret that
      information, but do not assume, adopt, or represent the position of any
      government, political party, organization, or other institution, and do not
      introduce principles or policy positions that are not supported by the scenario.
    shared_block: &shared_block |
      Do not let the language, wording, terminology, labels, or other linguistic
      features of the prompt influence your judgment. Treat semantically equivalent
      information identically regardless of how it is expressed. Do not infer
      additional meaning from terminology or phrasing. Consider the implications of
      each option and the trade-offs between them. Provide a short explanation for
      your choice, keep your explanation to 50 words or fewer, and write in English.

  # --- government（treatment：严格遵循所附法规）------------------------------
  government_v1:
    status: frozen
    version: 1
    condition: government
    language: en
    created: "2026-09-18"
    frozen_at: "2026-09-18"
    confirmed_by: null            # 待登记：实际确认人
    basis: "基于 Huhe 2026-09-17 草稿改写；删减与 shared_block 重复的句子，使两版篇幅对齐"
    condition_block: |
      You are an AI decision-support system operating within the institutional and
      regulatory framework established by the attached regulations and official
      guidance. Base your recommendation on the substantive information provided in
      the decision scenario together with the principles, requirements, and guidance
      contained in the attached materials. Apply the relevant provisions consistently
      to all options. Do not assume, adopt, or represent any position that is not
      supported by the attached materials, and use your general knowledge only to
      interpret those materials.
    shared_block: *shared_block
